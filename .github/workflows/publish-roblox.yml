name: Publish Roblox Place

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tools/**"
      - ".github/workflows/publish-roblox.yml"

concurrency:
  group: publish-roblox-place
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UNIVERSE_ID: "10708027069"
      PLACE_ID: "96625647109064"
      ROJO_VERSION: "7.7.0"
      OUTPUT_FILE: "OpenWorldOps.rbxlx"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rojo
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip" -o rojo.zip
          unzip -q rojo.zip
          chmod +x rojo
          ./rojo --version

      - name: Generate organic 16K world
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_static_map.py > generated.project.json
          test -s generated.project.json
          echo "Generated project bytes: $(wc -c < generated.project.json)"

      - name: Build Roblox place
        shell: bash
        run: |
          set -euo pipefail
          ./rojo build generated.project.json --output "$OUTPUT_FILE"
          test -s "$OUTPUT_FILE"
          echo "Built place bytes: $(wc -c < "$OUTPUT_FILE")"

      - name: Publish to Roblox Open Cloud
        shell: bash
        env:
          ROBLOX_API_KEY: ${{ secrets.GHOST_ROBLOX }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" --request POST \
            "https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published" \
            --header "x-api-key: ${ROBLOX_API_KEY}" \
            --header "Content-Type: application/xml" \
            --data-binary "@${OUTPUT_FILE}")
          cat response.json
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then exit 1; fi
          grep -q 'versionNumber' response.json

      - name: Upload built place artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Organic16K-place
          path: OpenWorldOps.rbxlx
          if-no-files-found: ignore
