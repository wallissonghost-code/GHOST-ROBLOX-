name: Publish Roblox Place

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "package.json"
      - "default.project.json"
      - ".github/workflows/publish-roblox.yml"

concurrency:
  group: publish-roblox-place
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UNIVERSE_ID: "10708027069"
      PLACE_ID: "96625647109064"
      ROJO_VERSION: "7.7.0"
      OUTPUT_FILE: "GhostRngBase.rbxlx"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Nevermore dependencies
        run: npm install --no-audit --no-fund

      - name: Install Rojo
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip" -o rojo.zip
          unzip -q rojo.zip
          chmod +x rojo
          ./rojo --version

      - name: Build Roblox place
        shell: bash
        run: |
          set -euo pipefail
          ./rojo build default.project.json --output "$OUTPUT_FILE"
          test -s "$OUTPUT_FILE"
          ls -lh "$OUTPUT_FILE"

      - name: Publish to Roblox Open Cloud
        shell: bash
        env:
          ROBLOX_API_KEY: ${{ secrets.GHOST_ROBLOX }}
        run: |
          set -euo pipefail
          if [ -z "${ROBLOX_API_KEY:-}" ]; then
            echo "Secret GHOST_ROBLOX is missing or empty."
            exit 1
          fi
          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
            --request POST \
            "https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published" \
            --header "x-api-key: ${ROBLOX_API_KEY}" \
            --header "Content-Type: application/xml" \
            --data-binary "@${OUTPUT_FILE}")
          echo "Roblox HTTP status: ${HTTP_CODE}"
          cat response.json
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then exit 1; fi
          grep -q 'versionNumber' response.json

      - name: Upload built place artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GhostRngBase-place
          path: GhostRngBase.rbxlx
          if-no-files-found: ignore
