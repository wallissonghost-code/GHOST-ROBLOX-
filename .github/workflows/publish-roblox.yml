name: Publish Roblox Place

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tools/**"
      - ".github/workflows/publish-roblox.yml"

concurrency:
  group: publish-roblox-place
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UNIVERSE_ID: "10708027069"
      PLACE_ID: "96625647109064"
      OUTPUT_FILE: "OpenWorldOps.rbxlx"
      MAP_ASSET_ID: "71516737"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rbxmk
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/anaminus/rbxmk/rbxmk@v0.9.1
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          "$HOME/go/bin/rbxmk" version

      - name: Download single licensed map
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/go/bin/rbxmk" download-asset --id "$MAP_ASSET_ID" SingleMap.rbxm
          test -s SingleMap.rbxm
          echo "Downloaded map bytes: $(wc -c < SingleMap.rbxm)"

      - name: Build place from single map
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/go/bin/rbxmk" run tools/build_single_map.rbxmk.lua SingleMap.rbxm "$OUTPUT_FILE"
          test -s "$OUTPUT_FILE"
          echo "Built place bytes: $(wc -c < "$OUTPUT_FILE")"

      - name: Publish to Roblox Open Cloud
        shell: bash
        env:
          ROBLOX_API_KEY: ${{ secrets.GHOST_ROBLOX }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" --request POST \
            "https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published" \
            --header "x-api-key: ${ROBLOX_API_KEY}" \
            --header "Content-Type: application/xml" \
            --data-binary "@${OUTPUT_FILE}")
          cat response.json
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then exit 1; fi
          grep -q 'versionNumber' response.json

      - name: Upload built place artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SingleReadyMap-place
          path: OpenWorldOps.rbxlx
          if-no-files-found: ignore
